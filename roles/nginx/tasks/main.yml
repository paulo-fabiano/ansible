---
- name: Instalar NGINX
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Copiar arquivo de configuração do NGINX
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart NGINX

- name: Garantir que o NGINX esteja ativo e habilitado
  service:
    name: nginx
    state: started
    enabled: yes
